<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">

<title>Backyard Ultra Fuel Tracker</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">

<style>

:root {
    color-scheme: dark;

    --bg: #07111f;
    --panel: #111d2f;
    --panel2: #17263b;
    --text: #f8fafc;
    --muted: #a7b3c5;
    --green: #22c55e;
    --line: #2a3a50;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
}

button,
input {
    font: inherit;
}

.app {
    max-width: 760px;
    margin: auto;
    padding: 18px 14px 42px;
}

.top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: center;
}

.eyebrow {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: .12em;
}

.top h1 {
    font-size: 23px;
    margin: 3px 0;
}

.badge {
    background: var(--panel2);
    padding: 10px 13px;
    border-radius: 14px;
    white-space: nowrap;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 10px;
    margin: 16px 0;
}

.card {
    background: var(--panel);
    padding: 14px;
    border-radius: 16px;
    border: 1px solid var(--line);
}

.label {
    color: var(--muted);
    font-size: 12px;
}

.value {
    font-size: 24px;
    font-weight: 800;
    margin-top: 4px;
}

h2 {
    font-size: 17px;
    margin: 22px 2px 9px;
}

.foods {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 9px;
}

.food {
    border: 1px solid var(--line);
    border-radius: 15px;
    background: var(--panel);
    color: var(--text);
    padding: 14px;
    text-align: left;
    min-height: 88px;
    cursor: pointer;
}

.food:active {
    transform: scale(.98);
    background: #1d3150;
}

.food .icon {
    font-size: 24px;
}

.food small {
    display: block;
    color: var(--muted);
    margin-top: 4px;
}

.actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
    margin-top: 14px;
}

.btn {
    border: 0;
    border-radius: 13px;
    padding: 14px;
    font-weight: 800;
    cursor: pointer;
}

.primary {
    background: var(--green);
    color: #05220f;
}

.secondary {
    background: #dbeafe;
    color: #10213f;
}

.danger {
    background: #7f1d1d;
    color: white;
}

details {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 15px;
    padding: 13px;
    margin-top: 14px;
}

summary {
    font-weight: 750;
    cursor: pointer;
}

.formgrid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
    margin-top: 12px;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 5px;
    color: var(--muted);
    font-size: 12px;
}

.field input {
    width: 100%;
    background: #091525;
    border: 1px solid #40516a;
    color: var(--text);
    padding: 11px;
    border-radius: 10px;
}

.span2 {
    grid-column: 1/-1;
}

.toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.mini {
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
    cursor: pointer;
}

.log {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.entry {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 13px;
    padding: 12px;
}

.meta,
.empty {
    color: var(--muted);
    font-size: 12px;
}

.amount {
    text-align: right;
    font-weight: 750;
}

.notice {
    min-height: 22px;
    color: #86efac;
    text-align: center;
    font-size: 13px;
    margin-top: 8px;
}

.foot {
    color: var(--muted);
    font-size: 12px;
    margin-top: 22px;
    text-align: center;
}

@media(min-width:620px) {

    .grid {
        grid-template-columns: repeat(4,1fr);
    }

    .foods {
        grid-template-columns: repeat(3,1fr);
    }
}

@media(prefers-color-scheme:light) {

    :root {
        color-scheme: light;
        --bg: #eef3f8;
        --panel: #ffffff;
        --panel2: #e4edf7;
        --text: #102033;
        --muted: #617086;
        --line: #d6e0eb;
    }

    .field input {
        background: #ffffff;
        color: #102033;
    }
}

</style>
</head>

<body>

<main class="app">

<header class="top">

    <div>
        <div class="eyebrow">
            BACKYARD ULTRA
        </div>

        <h1>
            Crew Fuel Tracker
        </h1>
    </div>

    <div class="badge">
        Yard <strong id="yard">1</strong>
    </div>

</header>


<section class="grid">

    <div class="card">
        <div class="label">Calories</div>
        <div class="value" id="calories">0</div>
    </div>

    <div class="card">
        <div class="label">Fluid</div>
        <div class="value" id="fluid">0 ml</div>
    </div>

    <div class="card">
        <div class="label">Carbohydrate</div>
        <div class="value" id="carbs">0 g</div>
    </div>

    <div class="card">
        <div class="label">Distance completed</div>
        <div class="value" id="distance">0.00 km</div>
    </div>

</section>


<h2>Quick add</h2>

<section id="foodGrid" class="foods"></section>


<div class="actions">

    <button id="nextYard"
            class="btn primary"
            type="button">

        🏁 Complete yard

    </button>

    <button id="undo"
            class="btn secondary"
            type="button">

        ↩ Undo last

    </button>

</div>


<details>

<summary>
    ➕ Add a custom food
</summary>

<form id="foodForm"
      class="formgrid">

    <label class="field span2">

        Name

        <input
        id="name"
        required
        maxlength="30"
        placeholder="e.g. Pizza">

    </label>


    <label class="field">

        Icon

        <input
        id="icon"
        maxlength="4"
        value="🍽️">

    </label>


    <label class="field">

        Calories

        <input
        id="foodCalories"
        type="number"
        min="0"
        max="5000"
        value="100"
        required>

    </label>


    <label class="field">

        Carbohydrate (g)

        <input
        id="foodCarbs"
        type="number"
        min="0"
        max="1000"
        value="20"
        required>

    </label>


    <label class="field">

        Fluid (ml)

        <input
        id="foodFluid"
        type="number"
        min="0"
        max="5000"
        value="0"
        required>

    </label>


    <button
    class="btn primary span2"
    type="submit">

        Add quick button

    </button>

</form>

</details>


<h2>Data</h2>

<div class="toolbar">

<button
id="export"
class="mini"
type="button">

    Export backup

</button>


<label class="mini">

    Import backup

    <input
    id="import"
    type="file"
    accept="application/json"
    hidden>

</label>


<button
id="reset"
class="mini danger"
type="button">

    Reset race

</button>

</div>


<div
id="notice"
class="notice"
aria-live="polite">
</div>


<h2>Consumption log</h2>

<section
id="log"
class="log">
</section>


<p class="foot">

Data is stored on this device.

</p>

</main>


<script>

(function () {

const KEY = "backyard-ultra-v2";


const defaults = [

{
id:"banana",
icon:"🍌",
name:"Banana",
calories:105,
carbs:27,
fluid:0
},

{
id:"gel",
icon:"⚡",
name:"Energy gel",
calories:100,
carbs:23,
fluid:0
},

{
id:"drink",
icon:"🥤",
name:"Sports drink",
calories:120,
carbs:30,
fluid:250
},

{
id:"water",
icon:"💧",
name:"Water",
calories:0,
carbs:0,
fluid:250
},

{
id:"cheese-pb",
icon:"🥪",
name:"Cheese + PB sandwich",
calories:350,
carbs:35,
fluid:0
},

{
id:"nutella",
icon:"🍫",
name:"Nutella sandwich",
calories:320,
carbs:45,
fluid:0
},

{
id:"jam",
icon:"🍓",
name:"Jam sandwich",
calories:240,
carbs:50,
fluid:0
},

{
id:"banana-pb",
icon:"🍌",
name:"Banana + PB sandwich",
calories:285,
carbs:39,
fluid:0
},

{
id:"mashed-potato",
icon:"🥔",
name:"Mashed potatoes",
calories:220,
carbs:35,
fluid:0
},

{
id:"baby-food",
icon:"👶",
name:"Baby food",
calories:70,
carbs:16,
fluid:0
},

{
id:"ramen",
icon:"🍜",
name:"Ramen noodles",
calories:380,
carbs:52,
fluid:0
},

{
id:"bone-broth",
icon:"🥣",
name:"Bone broth",
calories:40,
carbs:1,
fluid:250
}

];


function freshState() {

    return {
        yard: 1,
        foods: JSON.parse(JSON.stringify(defaults)),
        entries: []
    };

}


function loadState() {

    try {

        const saved =
            localStorage.getItem(KEY);

        if (!saved) {
            return freshState();
        }

        const parsed =
            JSON.parse(saved);

        if (
            !parsed ||
            !Array.isArray(parsed.foods) ||
            !Array.isArray(parsed.entries)
        ) {
            return freshState();
        }

        return parsed;

    }
    catch (error) {

        return freshState();

    }

}


let state = loadState();


function saveState() {

    localStorage.setItem(
        KEY,
        JSON.stringify(state)
    );

}


function totalValues() {

    let calories = 0;
    let carbs = 0;
    let fluid = 0;

    state.entries.forEach(function(entry) {

        calories += Number(entry.calories) || 0;
        carbs += Number(entry.carbs) || 0;
        fluid += Number(entry.fluid) || 0;

    });

    return {
        calories: calories,
        carbs: carbs,
        fluid: fluid
    };

}


function showNotice(message) {

    const notice =
        document.getElementById("notice");

    notice.textContent = message;

}


function addFood(food) {

    state.entries.push({

        id: food.id,
        icon: food.icon,
        name: food.name,

        calories:
            Number(food.calories) || 0,

        carbs:
            Number(food.carbs) || 0,

        fluid:
            Number(food.fluid) || 0,

        yard:
            state.yard,

        time:
            new Date().toISOString()

    });

    saveState();

    render();

    showNotice(
        food.name + " logged ✓"
    );

}


function renderFoodButtons() {

    const container =
        document.getElementById("foodGrid");

    container.innerHTML = "";


    state.foods.forEach(function(food) {

        const button =
            document.createElement("button");

        button.type = "button";

        button.className = "food";


        const icon =
            document.createElement("span");

        icon.className = "icon";

        icon.textContent = food.icon;


        const name =
            document.createElement("strong");

        name.textContent =
            food.name;


        const nutrition =
            document.createElement("small");

        let text =
            food.calories +
            " kcal • " +
            food.carbs +
            " g carbs";

        if (food.fluid > 0) {

            text +=
                " • " +
                food.fluid +
                " ml";

        }

        nutrition.textContent = text;


        button.appendChild(icon);

        button.appendChild(
            document.createElement("br")
        );

        button.appendChild(name);

        button.appendChild(nutrition);


        button.addEventListener(
            "click",
            function () {

                addFood(food);

            }
        );


        container.appendChild(button);

    });

}


function renderLog() {

    const log =
        document.getElementById("log");

    log.innerHTML = "";


    if (state.entries.length === 0) {

        const empty =
            document.createElement("div");

        empty.className = "empty";

        empty.textContent =
            "Nothing logged yet.";

        log.appendChild(empty);

        return;

    }


    const reversed =
        state.entries
        .slice()
        .reverse();


    reversed.forEach(function(entry) {

        const row =
            document.createElement("div");

        row.className = "entry";


        const left =
            document.createElement("div");


        const title =
            document.createElement("strong");

        title.textContent =
            entry.icon +
            " " +
            entry.name;


        const time =
            document.createElement("div");

        time.className = "meta";


        const date =
            new Date(entry.time);


        time.textContent =
            "Yard " +
            entry.yard +
            " • " +
            date.toLocaleTimeString(
                [],
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            );


        left.appendChild(title);

        left.appendChild(time);


        const right =
            document.createElement("div");

        right.className = "amount";


        right.textContent =
            entry.calories +
            " kcal";


        const nutrition =
            document.createElement("div");

        nutrition.className = "meta";


        let text =
            entry.carbs +
            " g carbs";


        if (entry.fluid > 0) {

            text +=
                " • " +
                entry.fluid +
                " ml";

        }


        nutrition.textContent = text;


        right.appendChild(nutrition);


        row.appendChild(left);

        row.appendChild(right);


        log.appendChild(row);

    });

}


function render() {

    const totals =
        totalValues();


    document
    .getElementById("yard")
    .textContent =
        state.yard;


    document
    .getElementById("calories")
    .textContent =
        totals.calories;


    document
    .getElementById("carbs")
    .textContent =
        totals.carbs +
        " g";


    document
    .getElementById("fluid")
    .textContent =
        totals.fluid +
        " ml";


    const completedYards =
        Math.max(
            0,
            state.yard - 1
        );


    const distance =
        completedYards *
        6.706;


    document
    .getElementById("distance")
    .textContent =
        distance.toFixed(2) +
        " km";


    renderFoodButtons();

    renderLog();

}


document
.getElementById("nextYard")
.addEventListener(
    "click",
    function () {

        state.yard++;

        saveState();

        render();

        showNotice(
            "Yard " +
            state.yard +
            " started ✓"
        );

    }
);


document
.getElementById("undo")
.addEventListener(
    "click",
    function () {

        if (
            state.entries.length === 0
        ) {

            showNotice(
                "Nothing to undo"
            );

            return;

        }


        const removed =
            state.entries.pop();


        saveState();

        render();


        showNotice(
            removed.name +
            " removed"
        );

    }
);


document
.getElementById("foodForm")
.addEventListener(
    "submit",
    function (event) {

        event.preventDefault();


        const name =
            document
            .getElementById("name")
            .value
            .trim();


        const icon =
            document
            .getElementById("icon")
            .value
            .trim() || "🍽️";


        const calories =
            Number(
                document
                .getElementById("foodCalories")
                .value
            ) || 0;


        const carbs =
            Number(
                document
                .getElementById("foodCarbs")
                .value
            ) || 0;


        const fluid =
            Number(
                document
                .getElementById("foodFluid")
                .value
            ) || 0;


        if (!name) {

            showNotice(
                "Please enter a food name"
            );

            return;

        }


        const food = {

            id:
                "custom-" +
                Date.now(),

            icon:
                icon,

            name:
                name,

            calories:
                calories,

            carbs:
                carbs,

            fluid:
                fluid

        };


        state.foods.push(food);

        saveState();

        render();


        document
        .getElementById("foodForm")
        .reset();


        document
        .getElementById("icon")
        .value =
            "🍽️";


        showNotice(
            name +
            " button added ✓"
        );

    }
);


document
.getElementById("reset")
.addEventListener(
    "click",
    function () {

        const answer =
            confirm(
                "Delete the race log and reset to Yard 1?"
            );


        if (!answer) {
            return;
        }


        state =
            freshState();


        saveState();

        render();


        showNotice(
            "Race reset ✓"
        );

    }
);


document
.getElementById("export")
.addEventListener(
    "click",
    function () {

        const data =
            JSON.stringify(
                state,
                null,
                2
            );


        const blob =
            new Blob(
                [data],
                {
                    type:
                    "application/json"
                }
            );


        const link =
            document
            .createElement("a");


        link.href =
            URL.createObjectURL(blob);


        link.download =
            "backyard-ultra-backup.json";


        link.click();


        URL.revokeObjectURL(
            link.href
        );

    }
);


document
.getElementById("import")
.addEventListener(
    "change",
    function (event) {

        const file =
            event.target.files[0];


        if (!file) {
            return;
        }


        const reader =
            new FileReader();


        reader.onload =
            function () {

                try {

                    const imported =
                        JSON.parse(
                            reader.result
                        );


                    if (
                        !Array.isArray(
                            imported.foods
                        ) ||
                        !Array.isArray(
                            imported.entries
                        )
                    ) {

                        throw new Error(
                            "Invalid backup"
                        );

                    }


                    state =
                        imported;


                    saveState();

                    render();


                    showNotice(
                        "Backup imported ✓"
                    );

                }
                catch (error) {

                    showNotice(
                        "Invalid backup file"
                    );

                }

            };


        reader.readAsText(file);

    }
);


if (
    "serviceWorker"
    in navigator
) {

    window.addEventListener(
        "load",
        function () {

            navigator
            .serviceWorker
            .register(
                "service-worker.js"
            )
            .catch(
                function (error) {

                    console.log(
                        "Service worker error:",
                        error
                    );

                }
            );

        }
    );

}


render();

})();

</script>

</body>
</html>
